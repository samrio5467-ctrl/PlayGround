const action=document.querySelector('#action');action.addEventListener('pointerdown',()=>{notify(count<5?'Follow the moonshards.':'The old forest is at peace.')});
const walkVec=new THREE.Vector3(),camOffset=new THREE.Vector3(10,10,10),desired=new THREE.Vector3();let velocityX=0,velocityZ=0,walkTime=0;const clock=new THREE.Clock();
function update(dt,time){let ix=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joyX;let iz=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joyY;let mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag}const speed=3.4;velocityX=THREE.MathUtils.damp(velocityX,ix*speed,ix||iz?12:8,dt);velocityZ=THREE.MathUtils.damp(velocityZ,iz*speed,ix||iz?12:8,dt);player.position.x=THREE.MathUtils.clamp(player.position.x+velocityX*dt,-10,10);player.position.z=THREE.MathUtils.clamp(player.position.z+velocityZ*dt,-10,10);const moving=Math.hypot(velocityX,velocityZ)>.18;if(moving){avatar.rotation.y=Math.atan2(velocityX,velocityZ);walkTime+=dt*10}avatar.position.y=moving?Math.abs(Math.sin(walkTime))*.055:Math.sin(time*2.3)*.018;for(let i=0;i<2;i++){const leg=avatar.children[6+i];if(leg)leg.rotation.x=moving?Math.sin(walkTime+i*Math.PI)*.24:0}
for(const s of shards){if(s.collected)continue;s.group.position.y=s.baseY+Math.sin(time*2.1+s.group.position.x)*.13;s.gem.rotation.y=time*.75;s.ring.rotation.z=time*.55;const d=Math.hypot(player.position.x-s.group.position.x,player.position.z-s.group.position.z);if(d<1.25){s.collected=true;scene.remove(s.group);count++;document.querySelector('#counter').textContent=`${count} / 5`;document.querySelector('#progress').style.width=`${count*20}%`;notify('Moonshard gathered ✧');if(count===5){document.querySelector('#questTitle').textContent='Light restored';document.querySelector('#questDesc').textContent='Whispervale glows a little brighter.';setTimeout(()=>document.querySelector('#complete').style.display='flex',650)}}}
fireflies.forEach(f=>{f.mesh.position.y=f.base.y+Math.sin(time*1.1+f.phase)*.28;f.mesh.position.x=f.base.x+Math.sin(time*.7+f.phase)*.2;f.mesh.material.opacity=.35+.55*(.5+.5*Math.sin(time*2+f.phase))});
desired.copy(player.position).add(camOffset);camera.position.lerp(desired,1-Math.exp(-4.2*dt));targetCamera.lerp(player.position,1-Math.exp(-5*dt));camera.lookAt(targetCamera.x,targetCamera.y+.15,targetCamera.z);
}
function resize(){const w=innerWidth,h=innerHeight,aspect=w/h;const viewH=16;camera.left=-viewH*aspect/2;camera.right=viewH*aspect/2;camera.top=viewH/2;camera.bottom=-viewH/2;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();
let running=true;document.addEventListener('visibilitychange',()=>{if(!document.hidden){clock.getDelta()}});
function frame(){if(!running)return;requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;update(dt,t);renderer.render(scene,camera)}
// Start at a useful scenic angle; camera settles smoothly onto the hero.
camera.position.copy(player.position).add(camOffset);camera.lookAt(player.position);requestAnimationFrame(()=>{document.querySelector('#loading').classList.add('hide');setTimeout(()=>document.querySelector('#loading').remove(),700)});frame();
// Ambient sound is an optional, synthesized soft forest hush; starts only on user request.
let audio=null,soundOn=false;const soundButton=document.querySelector('#sound');soundButton.addEventListener('click',()=>{if(!soundOn){try{audio=new (window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type='sine';osc.frequency.value=110;filter.type='lowpass';filter.frequency.value=170;gain.gain.value=.012;osc.connect(filter).connect(gain).connect(audio.destination);osc.start();soundOn=true;soundButton.style.color='#f1d38b'}catch(e){}}else{audio?.close();soundOn=false;soundButton.style.color=''}});
</script>
